# Build site/ and publish it to GitHub Pages.
#
# The landing page is React + Cloudflare's Kumo, PRERENDERED at build: every word
# is in dist/index.html, so crawlers read it and it works with JavaScript off.
# Not built with the template, deliberately — the template targets Cloudflare
# Workers (KV bindings, `_headers`, `_redirects`, an SSR adapter), none of which
# GitHub Pages serves.
#
# It is still held to the kit's own bar: pa11y-ci at WCAG 2.2 AA in BOTH
# palettes, no second scroll axis at 320px, and every asset the <head> promises
# resolving. All run against the built output, before anything deploys.

name: Pages

# ⚠ ON A FRESHLY RECREATED REPOSITORY, workflow_dispatch DOES NOT WORK YET.
# GitHub registers a workflow the first time it RUNS, and `gh workflow run
# pages.yml` answers `HTTP 404: workflow pages.yml not found on the default
# branch` until then — while the file is plainly sitting on the default branch.
# Kit and Publish register themselves because a push and a release fire them.
# This one only fires on its own paths, so it never gets a first run, and the
# Pages site stays 404 with nothing obviously wrong.
#
# The way out is a push touching one of the paths below. This comment was it.

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: template/.node-version

      # Installed once, at the root, and shared by both gates below. The reflow
      # check `import`s puppeteer, which resolves from node_modules and not from
      # `npx` — running it without this failed ERR_MODULE_NOT_FOUND while the
      # same command worked locally, because locally it ran from template/ where
      # puppeteer arrives with pa11y-ci.
      - name: Install the gate tools
        run: npm install --no-save pa11y-ci puppeteer serve wait-on

      - name: Build and prerender the page
        working-directory: site
        run: npm ci && npm run build

      # The text must be in the HTML, not only after JavaScript runs — that is
      # the point of prerendering, and a broken render step would ship an empty
      # <div id="root"> that every gate below, driving a real browser, passes.
      - name: Prerendered, not empty
        run: |
          grep -q 'Your build was green' site/dist/index.html || { echo "::error::dist/index.html carries no page text — the prerender did not run"; exit 1; }
          echo "  page text is in the HTML"

      - name: Serve the page
        run: npx serve site/dist -l 8099 &

      # ⚠ BOTH PALETTES, and that is the whole point of running it twice.
      #
      # The first run of this workflow failed on contrast that had passed
      # locally: a muted grey measured 4.83:1 dark and 3.91:1 light. A page with
      # two palettes has two sets of contrast pairs, and testing one proves
      # nothing about the other.
      #
      # The page is dark first and chooses its own palette, so the system colour
      # scheme no longer reaches the light one at all — forcing it (which this
      # step did, through a Blink setting, for a year) would measure dark twice.
      # Each palette is selected explicitly by URL instead: ?mode=light and
      # ?mode=dark. No flag to go quiet, nothing to probe.
      #
      # ⚠ "NEEDS REVIEW" IS A FAILURE HERE, ON PURPOSE. pa11y counts axe's
      #   incomplete results as errors. On the Kumo page that first meant 92 of
      #   them per palette — axe cannot read the oklch `none` hue Chrome reports
      #   for neutral colours — so site/scripts/hex-palette.mjs writes the palette
      #   as hex. Behind them were two real failures, found once the colours were
      #   readable: Kumo's subtle grey at 4.27:1 on its own light surfaces, and a
      #   headline over a gradient no checker can measure.
      - name: Accessibility — WCAG 2.2 AA, light and dark
        run: |
          npx wait-on http://localhost:8099 -t 30000
          cat > /tmp/pa11y.json <<JSON
          { "defaults": { "standard": "WCAG2AA", "runners": ["axe", "htmlcs"],
              "timeout": 30000, "chromeLaunchConfig": { "args": ["--no-sandbox"] } },
            "urls": ["http://localhost:8099/?mode=light", "http://localhost:8099/?mode=dark"] }
          JSON
          npx pa11y-ci --config /tmp/pa11y.json

      - name: Reflow — no second scroll axis at 320px
        run: |
          node -e "
          import('puppeteer').then(async ({default:p})=>{
            const b=await p.launch({args:['--no-sandbox']});
            let bad=0;
            for (const scheme of ['light','dark']) for (const w of [320,375,768,1440]) {
              const pg=await b.newPage();
              await pg.setViewport({width:w,height:800});
              await pg.goto('http://localhost:8099/?mode='+scheme,{waitUntil:'networkidle0'});
              const o=await pg.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(o>1){ console.error('overflow '+o+'px at '+w+'px, '+scheme); bad++; }
              await pg.close();
            }
            await b.close();
            process.exit(bad?1:0);
          });"

      # Every asset the <head> promises must actually resolve. A 404 og:image is
      # invisible on the page and breaks every share; a broken favicon or
      # sitemap is the same class of thing — declared, never fetched, never
      # noticed.
      # ⚠ RESOLVE WHAT THE PAGE ASKS FOR, NOT WHAT WE EXPECT IT TO. The step below fetches each
      #   asset by its known path, and passed while every screenshot 404'd live: the prerendered
      #   page asked for /showcase/…, from the domain root, and Pages serves this project under
      #   /website-build-kit/. Every src and href in the built HTML is resolved here exactly as a
      #   browser would resolve it on the live URL, then mapped back to the local server.
      - name: Every src and href the page uses resolves under the project path
        run: |
          node -e "
          const html = require('fs').readFileSync('site/dist/index.html', 'utf8');
          const live = 'https://nurkamol.github.io/website-build-kit/';
          const refs = [...html.matchAll(/\\s(?:src|href)=\"([^\"#]+)\"/g)].map((m) => m[1])
            .filter((r) => !/^(https?:|mailto:|data:)/.test(r) || r.startsWith(live));
          (async () => {
            let bad = 0;
            for (const r of [...new Set(refs)]) {
              const u = new URL(r, live);
              if (!u.href.startsWith(live)) { console.error('  ✗ ' + r + ' resolves outside the project path: ' + u.href); bad++; continue; }
              const local = 'http://localhost:8099/' + u.href.slice(live.length);
              const code = (await fetch(local)).status;
              console.log('  ' + code + '  ' + r);
              if (code !== 200) bad++;
            }
            process.exit(bad ? 1 : 0);
          })();"

      - name: SEO assets resolve
        run: |
          for f in brand/mark.svg brand/favicon-32.png brand/apple-touch-icon.png \
                   brand/og.jpg sitemap.xml robots.txt \
                   showcase/overview-hero.webp showcase/match.webp showcase/gate.webp \
                   showcase/running.webp showcase/overview-light.webp; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8099/$f")
            echo "  $code  $f"
            [ "$code" = "200" ] || { echo "::error::$f returned $code"; exit 1; }
          done
          node -e "
            const x = require('fs').readFileSync('site/dist/sitemap.xml','utf8');
            if (!x.includes('http://www.sitemaps.org/schemas/sitemap/0.9'))
              { console.error('sitemap namespace is wrong — crawlers reject it'); process.exit(1); }
            console.log('  sitemap namespace ok');
          "

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
