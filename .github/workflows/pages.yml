# Publish site/ to GitHub Pages.
#
# The landing page is hand-written, self-contained HTML — not built with the
# template, deliberately. The template targets Cloudflare Workers: KV bindings,
# `_headers`, `_redirects` and an SSR adapter, none of which GitHub Pages
# serves. Dogfooding it here would mean fighting the adapter to publish one
# static page, and the honest tool for one page is one file.
#
# It is still held to the kit's own bar: pa11y-ci at WCAG 2.2 AA, and no second
# scroll axis at 320px. Both run below, before anything deploys — a landing page
# for a kit that preaches accessibility has no excuse for failing either.

name: Pages

# ⚠ ON A FRESHLY RECREATED REPOSITORY, workflow_dispatch DOES NOT WORK YET.
# GitHub registers a workflow the first time it RUNS, and `gh workflow run
# pages.yml` answers `HTTP 404: workflow pages.yml not found on the default
# branch` until then — while the file is plainly sitting on the default branch.
# Kit and Publish register themselves because a push and a release fire them.
# This one only fires on its own paths, so it never gets a first run, and the
# Pages site stays 404 with nothing obviously wrong.
#
# The way out is a push touching one of the paths below. This comment was it.

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: template/.node-version

      # Installed once, at the root, and shared by both gates below. The reflow
      # check `import`s puppeteer, which resolves from node_modules and not from
      # `npx` — running it without this failed ERR_MODULE_NOT_FOUND while the
      # same command worked locally, because locally it ran from template/ where
      # puppeteer arrives with pa11y-ci.
      - name: Install the gate tools
        run: npm install --no-save pa11y-ci puppeteer serve wait-on

      - name: Serve the page
        run: npx serve site -l 8099 &

      # ⚠ BOTH COLOUR SCHEMES, and that is the whole point of running it twice.
      #
      # The first run of this workflow failed on contrast that had passed
      # locally, because local Chrome happened to be in DARK mode and the runner
      # was in light. `--ink-3` measured 4.83:1 dark and 3.91:1 light — a real AA
      # failure, invisible to a one-scheme test. A site with a light and a dark
      # palette has two sets of contrast pairs and testing one proves nothing
      # about the other.
      - name: Accessibility — WCAG 2.2 AA, light and dark
        run: |
          npx wait-on http://localhost:8099 -t 30000
          for scheme in light dark; do
            echo "── $scheme ──"
            cat > /tmp/pa11y-$scheme.json <<JSON
            { "defaults": { "standard": "WCAG2AA", "runners": ["axe", "htmlcs"],
                "timeout": 30000,
                "chromeLaunchConfig": { "args": ["--no-sandbox", "--force-prefers-color-scheme=$scheme"] } },
              "urls": ["http://localhost:8099/"] }
          JSON
            npx pa11y-ci --config /tmp/pa11y-$scheme.json || exit 1
          done

      - name: Reflow — no second scroll axis at 320px
        run: |
          node -e "
          import('puppeteer').then(async ({default:p})=>{
            const b=await p.launch({args:['--no-sandbox']});
            let bad=0;
            for (const scheme of ['light','dark']) for (const w of [320,375,768,1440]) {
              const pg=await b.newPage();
              await pg.emulateMediaFeatures([{name:'prefers-color-scheme',value:scheme}]);
              await pg.setViewport({width:w,height:800});
              await pg.goto('http://localhost:8099/',{waitUntil:'networkidle0'});
              const o=await pg.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(o>1){ console.error('overflow '+o+'px at '+w+'px, '+scheme); bad++; }
              await pg.close();
            }
            await b.close();
            process.exit(bad?1:0);
          });"

      # Every asset the <head> promises must actually resolve. A 404 og:image is
      # invisible on the page and breaks every share; a broken favicon or
      # sitemap is the same class of thing — declared, never fetched, never
      # noticed.
      - name: SEO assets resolve
        run: |
          for f in brand/mark.svg brand/favicon-32.png brand/apple-touch-icon.png \
                   brand/og.jpg sitemap.xml robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8099/$f")
            echo "  $code  $f"
            [ "$code" = "200" ] || { echo "::error::$f returned $code"; exit 1; }
          done
          node -e "
            const x = require('fs').readFileSync('site/sitemap.xml','utf8');
            if (!x.includes('http://www.sitemaps.org/schemas/sitemap/0.9'))
              { console.error('sitemap namespace is wrong — crawlers reject it'); process.exit(1); }
            console.log('  sitemap namespace ok');
          "

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
