<!--
  The brand tokens `npm run cards:brand` reads to draw the share cards, so the
  cards cannot drift from the page. Dark first, like the page itself.
-->
<style>
  :root { --bg: #0b0b0c; --ink: #f3f3f4; --accent: #f6821f; }
</style>
<script>
  // Dark first. ?mode=light|dark wins (the accessibility gate measures each
  // palette that way), then a saved choice; set before paint so nothing flashes.
  try {
    var q = new URLSearchParams(location.search).get('mode');
    var m = q === 'light' || q === 'dark' ? q : localStorage.getItem('kit-site-mode');
    if (m === 'light' || m === 'dark') document.documentElement.dataset.mode = m;
  } catch (e) {}
</script>

<div id="root"><!--app--></div>
